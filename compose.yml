name: web-main
services:
  web-main:
    build:
      context: .
      # Shown by /health, see Deployment in README.md
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: darco2903/web-main:latest
    container_name: web-main
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    volumes:
      - ./ssl/:/app/ssl/:ro
