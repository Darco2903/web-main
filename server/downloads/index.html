<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="stylesheet" href="/resources/css/global.css" />
        <!-- <link rel="stylesheet" href="/resources/css/upper-panel/index.css" /> -->
        <link rel="stylesheet" href="./resources/css/index.css" />

        <link rel="icon" href="../resources/images/icons/icon-128px.png" />
        <title>Downloads</title>
    </head>

    <body hidden>
        <div id="upper-panel"></div>

        <div id="content">
            <div id="dl-list-loading" class="loading"></div>

            <a class="user-but icon" id="back" href=".."></a>

            <div class="flex row align" id="tools">
                <div class="flex row align" id="search-container">
                    <label for="search">Search:</label>
                    <input id="search" type="text" placeholder="Search" />
                </div>
                <button class="user-but icon" id="refresh"></button>
            </div>

            <div id="dl-list-container">
                <div id="dl-list"></div>
            </div>
        </div>
    </body>

    <div id="clones" hidden>
        <div class="file flex column align">
            <div class="download-icon icon" type="archive"></div>
            <div class="download-name">File Name</div>
        </div>
    </div>

    <script src="/resources/js/global.js"></script>
    <script src="/resources/js/upper-panel.js" type="module"></script>
    <script src="./resources/js/index.js" type="module"></script>
</html>
