<!DOCTYPE html>
<html>
    <link rel="stylesheet" href="../style.css" type="text/css" />
    <link rel="stylesheet" href="/style.css" type="text/css" />

    <head>
        <title>Downloads</title>
        <link rel="icon" href="/images/logo-512px.png" type="image/png" />
    </head>

    <body theme="light" hidden>
        <div id="upperPanel">
            <div id="title">
                <a href="/"><img src="/images/logo-512px.png" class="home" /></a>
                <h1>Downloads</h1>
            </div>
            <a href="../"><button>Retour</button></a>
        </div>

        <div id="content">
            <div id="files-content"></div>
        </div>

        <div id="theme">
            <label id="theme-label">Change Theme</label>
            <input class="tgl tgl-light" id="theme-checkbox" type="checkbox" onchange="changeTheme()" />
            <label class="tgl-btn" for="theme-checkbox"></label>
        </div>
    </body>

    <div id="template" hidden>
        <div class="file">
            <img src="" />
            <a href="" class="hide" target="_blank"><button></button></a>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="/js/endPath.js"></script>
    <script src="/js/theme.js"></script>
</html>
