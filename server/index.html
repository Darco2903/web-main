<!DOCTYPE html>
<html>
    <link rel="stylesheet" type="text/css" href="style.css" />

    <head>
        <title>Main Page</title>
        <link rel="icon" href="/images/logo-512px.png" type="image/png" />
    </head>

    <body theme="light" hidden>
        <div id="upperPanel">
            <div id="title">
                <a href=""><img src="/images/logo-512px.png" class="home" /></a>
                <h1>Main Page</h1>
            </div>
        </div>

        <div id="content">
            <a class="hide" href="/server-manager/"><button>Server Manager</button></a>
            <a class="hide" href="/downloads/"><button>Downloads</button></a>
        </div>

        <div id="theme">
            <label id="theme-label">Change Theme</label>
            <input class="tgl tgl-light" id="theme-checkbox" type="checkbox" onchange="changeTheme()" />
            <label class="tgl-btn" for="theme-checkbox"></label>
        </div>
    </body>

    <script src="/js/endPath.js"></script>
    <script src="/js/theme.js"></script>
</html>
