<!DOCTYPE html>
<html>
    <link rel="stylesheet" type="text/css" href="/style.css" />
    <link rel="stylesheet" type="text/css" href="style.css" />

    <head>
        <title>Console</title>
        <link rel="icon" href="/images/logo-512px.png" />
    </head>

    <body theme="light" hidden>
        <div id="upperPanel">
            <div id="title">
                <a href="/"><img src="/images/logo-512px.png" class="home" /></a>
                <h1>Console</h1>
            </div>
            <a href="../"><button>Retour</button></a>
        </div>

        <div id="content">
            <div id="console-container">
                <div id="error" style="display: none">
                    <button id="refresh">
                        <img src="/images/refresh.svg" />
                    </button>
                    <label>Error</label>
                </div>

                <div id="console">
                    <div id="tools">
                        <button id="clear">Clear</button>
                    </div>
                    <div id="output">
                        <div id="console-content"></div>
                    </div>

                    <div id="separator"></div>

                    <div id="input">
                        <input type="text" />
                        <button id="send">Send</button>
                    </div>
                </div>
            </div>

            <div id="theme">
                <label id="theme-label">Change Theme</label>
                <input class="tgl tgl-light" id="theme-checkbox" type="checkbox" onchange="changeTheme()" />
                <label class="tgl-btn" for="theme-checkbox"></label>
            </div>
        </div>
    </body>

    <script src="https://cdn.jsdelivr.net/npm/ansi_up"></script>
    <script src="app.js" type="module"></script>
    <script src="/js/endPath.js"></script>
    <script src="/js/theme.js"></script>
</html>
