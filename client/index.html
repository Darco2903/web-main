<!doctype html>
<html lang="en">
  <head>
    <meta property="og:url" content="https://darco2903.fr/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Main Server" />
    <meta property="og:description" content="Main server" />
    <meta property="og:image" content="/icon-main.png" />

    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-main.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      // Early theme detection to prevent FOUC, colors match --g-bg-base in styles/glass.css

      function getCookie(name) {
        return document.cookie
          .split("; ")
          .find((row) => row.startsWith(name))
          ?.split("=")[1];
      }

      const light = "#eef1f8";
      const dark = "#0a0c12";
      const theme = localStorage.getItem("theme") || getCookie("theme");
      const preferDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

      if (theme === "dark" || ((!theme || theme === "system") && preferDark)) {
        document.documentElement.style.background = dark;
      } else {
        document.documentElement.style.background = light;
      }
    </script>

    <title>Main Server</title>
  </head>

  <body class="g-backdrop no-transition">
    <div id="app"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
